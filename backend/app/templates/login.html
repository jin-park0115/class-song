{% extends "base.html" %}
{% block title %}로그인 · AX2 Jukebox{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>로그인</h1>
  <form id="login-form" novalidate>
    <label for="login_id">아이디</label>
    <input id="login_id" name="login_id" autocomplete="username" required autofocus>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p id="login-error" class="alert" role="alert" hidden></p>
    <button type="submit" class="btn primary wide">로그인</button>
  </form>
  <p class="muted small center-text">처음이신가요? <a href="/signup">회원가입</a></p>
</section>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("login-error");
    err.hidden = true;
    try {
      const me = await api.post("/api/auth/login", {
        login_id: document.getElementById("login_id").value,
        password: document.getElementById("password").value,
      });
      location.href = api.homeFor(me);
    } catch (ex) {
      err.textContent = ex.message;
      err.hidden = false;
    }
  });
</script>
{% endblock %}

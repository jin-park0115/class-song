{% extends "base.html" %}
{% block title %}비밀번호 변경 · AX2 Jukebox{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>비밀번호 변경</h1>
  <p id="forced" class="muted small" hidden>관리자가 발급한 임시 비밀번호로 로그인했어요. 새 비밀번호를 정해야 계속할 수 있어요.</p>
  <form id="pw-form" novalidate>
    <label for="current">현재(임시) 비밀번호</label>
    <input id="current" type="password" autocomplete="current-password" required autofocus>
    <label for="next">새 비밀번호</label>
    <input id="next" type="password" autocomplete="new-password" required aria-describedby="pw-help">
    <p id="pw-help" class="muted small hint">10자 이상, 아이디를 포함할 수 없어요.</p>
    <label for="next2">새 비밀번호 확인</label>
    <input id="next2" type="password" autocomplete="new-password" required>
    <p id="err" class="alert" role="alert" hidden></p>
    <button type="submit" class="btn primary wide">변경</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script>
  api.get("/api/auth/me").then((me) => {
    document.getElementById("forced").hidden = !me.must_change_password;
  }).catch((ex) => { if (ex.status === 401) location.href = "/login"; });

  document.getElementById("pw-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = (id) => document.getElementById(id).value;
    const err = document.getElementById("err");
    err.hidden = true;
    if (v("next") !== v("next2")) {
      err.textContent = "새 비밀번호가 서로 다릅니다.";
      err.hidden = false;
      return;
    }
    try {
      const me = await api.post("/api/auth/password", { current_password: v("current"), new_password: v("next") });
      location.href = api.homeFor(me);
    } catch (ex) {
      err.textContent = ex.message;
      err.hidden = false;
    }
  });
</script>
{% endblock %}

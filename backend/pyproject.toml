[project]
name = "ax2-jukebox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "deno>=2.9.7",
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mutagen>=1.48.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-mpd2>=3.1.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: 실제 mpd 바이너리가 필요한 테스트"]

# Docker(노트북 테스트)용 MPD 설정. 강의실 서버는 deploy/mpd/mpd.conf(ALSA 출력)를 쓴다.
music_directory   "/srv/ax2-jukebox/media"
db_file           "/var/lib/mpd/database"
state_file        "/var/lib/mpd/state"
pid_file          "/run/mpd/pid"
log_file          "/dev/stdout"

# Docker 내부 네트워크에서만 접근(compose에서 6600 포트를 외부로 열지 않는다)
bind_to_address   "0.0.0.0"
port              "6600"
restore_paused    "yes"
zeroconf_enabled  "no"
auto_update       "no"

audio_output {
    type          "httpd"
    name          "Monitor Stream"
    encoder       "lame"
    port          "8001"
    bind_to_address "0.0.0.0"
    bitrate       "192"
    format        "44100:16:2"
    always_on     "yes"
    tags          "yes"
    mixer_type    "software"
}

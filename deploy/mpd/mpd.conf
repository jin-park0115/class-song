# AX2 Jukebox — 강의실 서버용 MPD 설정 템플릿
# 설치 위치: /etc/mpd.conf   (자세한 절차: docs/ubuntu-audio-setup.md)

music_directory   "/srv/ax2-jukebox/media"
playlist_directory "/var/lib/mpd/playlists"
db_file           "/var/lib/mpd/tag_cache"
state_file        "/var/lib/mpd/state"
sticker_file      "/var/lib/mpd/sticker.sql"
log_file          "syslog"

user              "mpd"

# 보안: 로컬에서만 수신한다(NFR-004). 외부에 6600 포트를 노출하지 않는다.
bind_to_address   "127.0.0.1"
port              "6600"

# 재부팅 후 MPD가 스스로 재생을 재개하지 않게 한다. 재합류는 앱 스케줄러가 결정한다(요구사항 4.1).
restore_paused    "yes"
zeroconf_enabled  "no"

# 실제 앰프 출력. device 는 `aplay -l` 결과로 바꾼다(예: USB DAC가 card 1 이면 "hw:1,0").
audio_output {
    type          "alsa"
    name          "Classroom Amp"
    device        "hw:0,0"
    mixer_type    "software"   # 볼륨을 MPD가 직접 제어(OS 믹서와 분리)
}

# 개발용: 소리 장치 없이 MPD를 실행한다(null 출력). scripts/dev-mpd.sh 가 사용한다.
music_directory   "MEDIA_DIR"
db_file           "STATE_DIR/database"
state_file        "STATE_DIR/state"
pid_file          "STATE_DIR/pid"
log_file          "STATE_DIR/log"
bind_to_address   "127.0.0.1"
port              "6600"
restore_paused    "yes"
zeroconf_enabled  "no"

audio_output {
    type          "null"
    name          "Null Output (dev)"
    mixer_type    "software"
}
